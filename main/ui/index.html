<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
    ">
    <title>Lexa</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.css">
  </head>
  <body>
    <nav class="sidebar">
      <div class="sidebar__nav-item" data-view="view-overview"><i class="sidebar__icon--active fas  fa-database"></i></div>
      <div class="sidebar__nav-item" data-view="view-lexicon"><i class="sidebar__icon fas fa-language"></i></div>
      <div class="sidebar__nav-item"><i class="sidebar__icon fas fa-book"></i></div>
      <div class="sidebar__nav-item"><i class="sidebar__icon--active fas fa-gear"></i></div>
    </nav>

    <div class="main">

      <div class="main__view main__view--active" id="view-overview"></div>

      <div class="main__view" id="view-lexicon"></div>

    </div>

    <div class="corner"></div>

    <div class="statusbar">
      <p><i id="lexadb-validation" class="fas fa-database"></i> <span id="lexadb-path" class="statusbar__dbpath">No Lexa database opened</span></p>
    </div>

  </body>
  <script type="module" src="renderer/index.js"></script>
</html>
